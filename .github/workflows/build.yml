name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check stickers against WhatsApp's rules
        run: node tools/sticker-gen/validate.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The Firebase config is kept in a repository secret, not in the code.
      # Without it (for example in pull requests from forks) the app builds without AI stickers.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config added."
          else
            echo "No GOOGLE_SERVICES_JSON secret; building without AI stickers."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: romcom-stickers-debug-apk
          path: app/build/outputs/apk/debug/*.apk
